<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kelola POS (Uraian ⇄ Kategori)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-cyan-100 to-blue-200 min-h-screen p-2 sm:p-4 relative">

  <!-- SPINNER -->
  <div id="spinner" class="fixed inset-0 bg-white bg-opacity-70 z-50 flex items-center justify-center hidden">
    <div class="w-16 h-16 border-4 border-blue-500 border-dashed rounded-full animate-spin"></div>
  </div>

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
    <!-- ... konten sebelumnya tetap ... -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script>
    const spinner = document.getElementById('spinner');

    function showSpinner() {
      spinner.classList.remove('hidden');
    }

    function hideSpinner() {
      spinner.classList.add('hidden');
    }

    function loadPOS() {
      showSpinner();
      fetch(getAPIUrl("get") + `&sheet=POS`)
        .then(res => res.json())
        .then(data => {
          dataPOS = data;
          const tbody = document.querySelector("#posTable tbody");
          tbody.innerHTML = '';
          dataPOS.forEach((item, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="p-3">${i + 1}</td>
              <td class="p-3">${item.uraian}</td>
              <td class="p-3">${item.pos}</td>
              <td class="p-3">
                <button class="bg-yellow-400 text-black px-3 py-1 rounded-md text-sm mr-2" onclick="editPos(${i})">✏️ Edit</button>
                <button class="bg-red-500 text-white px-3 py-1 rounded-md text-sm" onclick="hapusPos(${i + 2})">🗑️ Hapus</button>
              </td>`;
            tbody.appendChild(tr);
          });
        })
        .catch(err => alert("❌ Gagal load POS: " + err.message))
        .finally(hideSpinner);
    }

    function tambahPos() {
      const uraian = document.getElementById("uraianInput").value.trim().toUpperCase();
      const pos = document.getElementById("posInput").value.trim().toUpperCase();
      if (!uraian || !pos) return alert("Kedua field harus diisi.");

      showSpinner();
      fetch(getAPIUrl("add"), {
        method: 'POST',
        body: JSON.stringify({
          sheet: "POS",
          action: "add",
          payload: { values: [uraian, pos] }
        })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById("uraianInput").value = '';
        document.getElementById("posInput").value = '';
        loadPOS();
      })
      .catch(err => alert("❌ Gagal tambah POS: " + err.message))
      .finally(hideSpinner);
    }

    function editPos(index) {
      const current = dataPOS[index];
      const newUraian = prompt("Edit Uraian:", current.uraian);
      if (newUraian === null) return;
      const newPos = prompt("Edit Pos:", current.pos);
      if (newPos === null) return;

      showSpinner();
      fetch(getAPIUrl("edit"), {
        method: 'POST',
        body: JSON.stringify({
          sheet: "POS",
          action: "edit",
          payload: {
            row: index + 2,
            values: [newUraian.trim().toUpperCase(), newPos.trim().toUpperCase()]
          }
        })
      })
      .then(res => res.json())
      .then(loadPOS)
      .catch(err => alert("❌ Gagal edit POS: " + err.message))
      .finally(hideSpinner);
    }

    function hapusPos(row) {
      if (!confirm("Yakin ingin menghapus baris " + row + "?")) return;
      showSpinner();
      fetch(getAPIUrl("delete"), {
        method: 'POST',
        body: JSON.stringify({
          sheet: "POS",
          action: "delete",
          payload: { row }
        })
      })
      .then(res => res.json())
      .then(loadPOS)
      .catch(err => alert("❌ Gagal hapus POS: " + err.message))
      .finally(hideSpinner);
    }

    function uploadExcel() {
      const file = document.getElementById('fileUpload').files[0];
      if (!file) return alert("Pilih file Excel terlebih dahulu.");

      showSpinner();
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        Promise.all(rows.map(row => {
          if (row[0] && row[1]) {
            return fetch(getAPIUrl("add"), {
              method: 'POST',
              body: JSON.stringify({
                sheet: "POS",
                action: "add",
                payload: { values: [row[0], row[1]] }
              })
            });
          }
        }))
        .then(() => loadPOS())
        .catch(err => alert("❌ Gagal upload: " + err.message))
        .finally(hideSpinner);
      };
      reader.readAsArrayBuffer(file);
    }

    loadPOS();
    setTimeout(() => localStorage.removeItem('loggedIn'), 300000);
  </script>
</body>
</html>
