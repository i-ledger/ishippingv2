<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · i-Shipping</title><link rel="icon" href="pertamina-logoicon.png"><link rel="stylesheet" href="style.css"></head><body>
<main class="auth"><form class="card brand" id="f">
<img src="pertamina-logo.png" alt="i-Shipping">
<div class="f"><label for="id">Email atau Sold to</label><input id="id" required autocomplete="username"></div>
<div class="f"><label for="pw">Kata sandi</label><input id="pw" type="password" required autocomplete="current-password"></div>
<button class="btn block" id="go">Masuk</button><div class="msg" id="msg" role="alert"></div>
<p class="mut" style="text-align:center;margin-top:14px">Belum punya akun? <a href="register.html">Daftarkan PT</a></p>
</form></main>
<script src="config.js"></script><script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
const m=document.getElementById('msg'),b=document.getElementById('go'),id=document.getElementById('id').value.trim(),pw=document.getElementById('pw').value.trim();
m.className='msg ok';m.textContent='Memproses…';b.disabled=true;
try{const r=await(await fetch(`${API_ENDPOINT}?action=loginPT&identifier=${encodeURIComponent(id)}&password=${encodeURIComponent(pw)}`)).json();
if(r.status==='success'&&r.id_spreadsheet){localStorage.setItem('loggedIn','true');localStorage.setItem('id_spreadsheet',r.id_spreadsheet);localStorage.setItem('nama_pt',r.nama_pt);localStorage.setItem('email',id);location.href='dashboard.html';return}
m.className='msg';m.textContent=r.message||'Email atau kata sandi salah.'}catch{m.className='msg';m.textContent='Tidak bisa terhubung ke server. Periksa koneksi lalu coba lagi.'}
b.disabled=false};
</script></body></html>
